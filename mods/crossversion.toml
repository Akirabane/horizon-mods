id = "crossversion"
kind = "native-mod"
name = "Cross Version"
summary = "Join servers on older Minecraft versions: picks the version per server, runs ViaProxy locally, and logs in with an account added to the proxy."
description = "**Cross-version** lets Horizon join servers running an older Minecraft version. On a join it reads what version the server speaks, and if it isn't 26.3 it starts ViaProxy on a loopback port so the server is spoken to in its own version — a 26.3 server is never touched. The server list marks those servers joinable (green bars, version in green above the MOTD), Edit Server and Direct Connect carry a click-to-change version switch for servers whose status lies, and online-mode works by logging in with a Microsoft account you add to ViaProxy once from its settings page. Horizon itself never signs anything, so a joined server can't use your session elsewhere. It downloads ViaProxy (GPL-3.0, hash-pinned) on first use and needs Java 17+; nothing else."
authors = ["JustKarkat"]
owners = ["JustKarkat"]
license = "MIT"
source = "https://github.com/JustKarkat/horizon-crossversion/"
icon = "https://github.com/JustKarkat/horizon-crossversion/blob/master/icon.png?raw"
