id = "horizon_voice"
kind = "native-mod"
name = "Horizon Voice"
summary = "Proximity voice chat compatible with Simple Voice Chat 2.6.x servers. Not affiliated with Simple Voice Chat."
description = """
Proximity voice chat for Horizon. It speaks the network protocol of [Simple Voice Chat](https://modrinth.com/plugin/simple-voice-chat) by Max Henkel, so a Horizon player can talk with Java Edition players on servers that run Simple Voice Chat 2.6.x. The server still needs that plugin or mod.

**Relation to Simple Voice Chat:** this is a separate implementation written in Rust. It is not made by, affiliated with or endorsed by its authors and contains none of its code, but its wire format was worked out by reading Simple Voice Chat's public source, whose licence reserves all rights. Their permission has not been asked for.

- Push to talk (V) or voice activation, mute (M), menu (G); keys can be changed in Options > Mods
- Volume by distance and stereo panning
- Groups: from the menu or with `/vgroup`
- Noise suppression, microphone gain, device choice, microphone test
- English and Russian, following the game's language

Uses the microphone and opens a UDP connection to the voice server the Minecraft server names. Built for Horizon revision 4aa6854. Includes opus-rs (BSD-3-Clause)."""
