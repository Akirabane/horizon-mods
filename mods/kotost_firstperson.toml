id = "kotost_firstperson"
kind = "native-mod"
name = "Kotost First Person"
summary = "Your own body, legs and arms in first person, items in your 3D hands, the game's hands for eating."
description = """
- **Your own body in first person**: look down and see your body, legs and both arms in 3D, in your own skin, instead of the flat floating hands. The body leans back as you look down.
- **Items in your 3D hands**, main hand and off hand.
- **Eating and drinking**: the game's own hands bring the food before your face while you eat, or the 3D arm does (`eat_hand = 0`).
- **One shadow**: with a shader pack, the shadow pass keeps the head where it really is.
- **Settings** in `config/kotost-firstperson.txt` (re-read while you play). Kotost Body 0.3's first-person lines are carried over on the first run.

Works alone. With Kotost Bust your body has its bust and figure; whatever a mod draws on the player model shows on it. Client side only.

Native source mod: the launcher compiles it after a warning; it runs with your account's permissions. No Minecraft code or assets are included."""
authors = ["Kotost Games"]
owners = ["Leks2000"]
owner_ids = [107043945]
license = "MIT"
source = "https://github.com/Leks2000/kotost-firstperson"
icon = "icons/kotost_firstperson.png"
