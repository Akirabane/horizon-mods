changelog = """
- A grey "?" marks servers whose location can't be shown; hover it for why (blocked by an ad blocker, behind DDoS protection, or an address that doesn't resolve). New setting to hide it.
- A line in the game log says why a lookup failed, once per server.
- Blocked or failed lookups are retried after a minute (3 times at most): unblocking api.country.is works without a restart.
- README: "No flags?" with allowlist steps for AdGuard Home, AdGuard and Pi-hole."""

