changelog = "Kotost Body is split in two: this mod is the bust and the figure, and first person is its own mod, Kotost First Person (kotost_firstperson). New since 0.2.1: the hourglass figure for every bust wearer, vanilla chestplates drawn in the figure's shape with cups over the bust, other mods' dresses can take the bust over. Settings of first person moved to the new mod."
