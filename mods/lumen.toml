changelog = """
   - New: Quality setting Low / Medium / High / Ultra to fit your PC
   - New "Graphics and Performance" page: shadows on/off, shadow resolution (1024–4096), shadow distance (64–256 blocks), reflections
   - Nicer waves: no repeating pattern, no more lines
   - Much better underwater: light shafts, floating particles, deeper blue
   - No more flash when surfacing
   - Bright sand, snow and quartz no longer glow too much
   - Softer firefly light
   - All settings in English"""

