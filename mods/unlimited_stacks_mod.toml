id = "unlimited_stacks_mod"
kind = "native-mod"
name = "Unlimited Stacks"
summary = "Configurable stack limit for normally 64-stack, non-damageable items, with compact inventory counts."
description = "Raises the stack limit for non-damageable items that normally stack to 64. Set a custom limit in Options → Mods, with a maximum of 2,147,483,647. Large inventory counts use compact labels such as 1k, 1.23m, and 2.14b. Items that normally stack to 1 or 16, and damageable items, are unchanged."
